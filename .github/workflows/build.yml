name: 构建多平台安装包

on:
  # 在 GitHub Actions 页面中手动点击 Run workflow 即可开始构建。
  workflow_dispatch:

  # 推送 v1.0.0 这类版本标签时也会自动开始构建。
  push:
    tags:
      - "v*"

# 构建任务只需要读取仓库代码。
permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows x64
    runs-on: windows-latest

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 与本地开发环境保持一致，避免不同 Bun 版本产生依赖差异。
          bun-version: 1.3.14

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 检查项目类型
        run: |
          bun run typecheck
          bunx tsc --noEmit -p tsconfig.node.json

      - name: 生成 Windows 安装包
        run: bun run dist:win

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: XMD-Windows-x64
          path: release/XMD-*-Windows-x64.exe
          if-no-files-found: error

  build-macos:
    name: 构建 macOS x64 和 arm64
    # Intel Runner 可以生成 Intel 和 Apple Silicon 两种架构的安装包。
    runs-on: macos-15-intel
    env:
      # 没有 Apple 开发者证书时关闭签名证书自动查找。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 检查项目类型
        run: |
          bun run typecheck
          bunx tsc --noEmit -p tsconfig.node.json

      - name: 生成 macOS 安装包
        run: bun run dist:mac

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: XMD-macOS
          path: release/XMD-*-macOS-*.dmg
          if-no-files-found: error

  build-linux:
    name: 构建 Linux x64 和 arm64
    runs-on: ubuntu-latest

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装项目依赖
        run: bun install --frozen-lockfile

      - name: 检查项目类型
        run: |
          bun run typecheck
          bunx tsc --noEmit -p tsconfig.node.json

      - name: 生成 Linux 安装包
        run: bun run dist:linux

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: XMD-Linux
          path: release/XMD-*-Linux-*.AppImage
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    # 手动构建只保留 Actions Artifacts，推送版本标签时才正式发布。
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      # 创建 Release 和上传安装包需要仓库内容写入权限。
      contents: write

    steps:
      - name: 下载所有平台安装包
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "XMD ${{ github.ref_name }}" \
            --generate-notes
